
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#087f8c">
  <title>نظام متابعة مرضى الصيدلية</title>

  <style>
    :root {
      --primary: #087f8c;
      --primary-dark: #066570;
      --bg: #f3f7fa;
      --card: #ffffff;
      --text: #203040;
      --muted: #667788;
      --border: #dce5eb;
      --danger: #c62828;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    button, input, textarea, select {
      font: inherit;
    }

    button {
      cursor: pointer;
      border: 0;
      border-radius: 9px;
      padding: 10px 14px;
      background: var(--primary);
      color: white;
    }

    button:hover { background: var(--primary-dark); }
    button:disabled { opacity: .6; cursor: wait; }

    .secondary { background: #e8f1f4; color: #174451; }
    .danger { background: var(--danger); }
    .small { padding: 6px 10px; font-size: 14px; }

    header {
      background: var(--primary);
      color: white;
      padding: 17px 4%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    header h1 { margin: 0; font-size: 21px; }
    header p { margin: 3px 0 0; font-size: 13px; opacity: .9; }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .header-actions button {
      background: white;
      color: var(--primary-dark);
    }

    main {
      width: min(1100px, 94%);
      margin: 22px auto;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 3px 12px rgba(20, 50, 70, .035);
    }

    h2 { font-size: 19px; margin: 0 0 15px; }
    h3 { font-size: 16px; margin: 0 0 10px; }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .field { display: flex; flex-direction: column; gap: 5px; }
    .field.full { grid-column: 1 / -1; }
    label { font-size: 14px; font-weight: 600; }

    input, textarea, select {
      width: 100%;
      min-width: 0;
      padding: 11px;
      border: 1px solid #ccd8e0;
      border-radius: 9px;
      background: white;
      color: var(--text);
    }

    input:focus, textarea:focus, select:focus {
      outline: 2px solid #b5e4e7;
      border-color: var(--primary);
    }

    textarea { min-height: 85px; resize: vertical; }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 16px;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }

    .toolbar input { flex: 1; min-width: 200px; }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .stat {
      background: white;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 15px;
    }

    .stat span { display: block; color: var(--muted); font-size: 13px; }
    .stat strong { display: block; font-size: 24px; color: var(--primary); }

    .patient-list { display: grid; gap: 12px; }

    .patient {
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .patient-info { min-width: 0; flex: 1; }
    .patient-info strong { display: block; overflow-wrap: anywhere; }
    .muted { color: var(--muted); font-size: 13px; }
    .patient-actions { display: flex; gap: 7px; flex-wrap: wrap; }

    .empty, .message {
      padding: 14px;
      border-radius: 9px;
      background: #eef5f7;
      color: #385866;
      margin: 10px 0;
      overflow-wrap: anywhere;
    }

    .message.error { background: #ffebee; color: #9b1c1c; }
    .message.success { background: #e7f6ed; color: #176638; }

    .hidden { display: none !important; }

    .profile-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .profile-item {
      border-bottom: 1px solid var(--border);
      padding: 9px 0;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .profile-item strong { display: block; font-size: 13px; color: var(--muted); }

    #barcodeBox {
      text-align: center;
      padding: 15px 0;
    }

    #barcode { max-width: 100%; height: auto; }

    footer {
      text-align: center;
      color: var(--muted);
      padding: 18px;
      font-size: 12px;
    }

    @media (max-width: 650px) {
      .form-grid, .profile-grid { grid-template-columns: 1fr; }
      .stats { grid-template-columns: 1fr; }
      .card { padding: 15px; }
      header h1 { font-size: 18px; }
      .patient { align-items: flex-start; }
      .patient-actions { width: 100%; }
    }

    @media print {
      body * { visibility: hidden !important; }
      #printArea, #printArea * { visibility: visible !important; }
      #printArea {
        display: block !important;
        position: absolute;
        inset: 0;
        width: 100%;
        padding: 20px;
        background: white;
        color: black;
      }
      .no-print { display: none !important; }
    }
  </style>
</head>

<body>
<header>
  <div>
    <h1 id="appTitle">نظام متابعة مرضى الصيدلية</h1>
    <p id="appSubtitle">إدارة ملفات المرضى ومواعيد المراجعة</p>
  </div>
  <div class="header-actions">
    <button id="languageButton" type="button">English</button>
    <button id="logoutButton" class="hidden" type="button">تسجيل الخروج</button>
  </div>
</header>

<main>
  <div id="globalMessage" class="message hidden" role="status"></div>

  <section id="loginSection" class="card">
    <h2 id="loginTitle">تسجيل الدخول</h2>
    <p id="loginHint" class="muted">سجّل الدخول باستخدام حساب Firebase المصرح له.</p>

    <form id="loginForm">
      <div class="form-grid">
        <div class="field full">
          <label id="emailLabel" for="email">البريد الإلكتروني</label>
          <input id="email" type="email" autocomplete="username" required>
        </div>
        <div class="field full">
          <label id="passwordLabel" for="password">كلمة المرور</label>
          <input id="password" type="password" autocomplete="current-password" required>
        </div>
      </div>
      <div class="actions">
        <button id="loginButton" type="submit">دخول</button>
      </div>
    </form>
  </section>

  <section id="appSection" class="hidden">
    <div class="stats">
      <div class="stat">
        <span id="totalLabel">إجمالي المرضى</span>
        <strong id="totalPatients">0</strong>
      </div>
      <div class="stat">
        <span id="resultsLabel">نتائج البحث</span>
        <strong id="resultCount">0</strong>
      </div>
      <div class="stat">
        <span id="accountLabel">الحساب الحالي</span>
        <strong id="accountEmail" style="font-size:13px; overflow-wrap:anywhere;">—</strong>
      </div>
    </div>

    <section class="card">
      <h2 id="formTitle">إضافة مريض جديد</h2>
      <form id="patientForm">
        <input id="patientId" type="hidden">

        <div class="form-grid">
          <div class="field">
            <label id="nameLabel" for="patientName">اسم المريض *</label>
            <input id="patientName" required maxlength="150">
          </div>

          <div class="field">
            <label id="phoneLabel" for="patientPhone">رقم الهاتف *</label>
            <input id="patientPhone" type="tel" required maxlength="30">
          </div>

          <div class="field">
            <label id="diseaseLabel" for="patientDisease">المرض المزمن</label>
            <input id="patientDisease" maxlength="250">
          </div>

          <div class="field">
            <label id="barcodeLabel" for="patientBarcode">رقم الباركود (اختياري)</label>
            <input id="patientBarcode" maxlength="100">
          </div>

          <div class="field">
            <label id="daysLabel" for="followUpDays">المراجعة بعد (أيام)</label>
            <input id="followUpDays" type="number" min="0" max="3650" value="30">
          </div>

          <div class="field">
            <label id="visitLabel" for="lastVisit">تاريخ آخر مراجعة</label>
            <input id="lastVisit" type="date">
          </div>

          <div class="field full">
            <label id="medicinesLabel" for="patientMedicines">الأدوية والجرعات</label>
            <textarea id="patientMedicines" maxlength="5000"></textarea>
          </div>

          <div class="field full">
            <label id="notesLabel" for="patientNotes">ملاحظات</label>
            <textarea id="patientNotes" maxlength="5000"></textarea>
          </div>
        </div>

        <div class="actions">
          <button id="savePatientButton" type="submit">حفظ المريض</button>
          <button id="cancelEditButton" class="secondary hidden" type="button">إلغاء التعديل</button>
          <button id="clearFormButton" class="secondary" type="button">تفريغ الحقول</button>
        </div>
      </form>
    </section>

    <section class="card">
      <h2 id="patientsTitle">ملفات المرضى</h2>
      <div class="toolbar">
        <input id="searchInput" type="search"
          placeholder="ابحث بالاسم أو الهاتف أو الباركود">
        <button id="refreshButton" class="secondary" type="button">تحديث القائمة</button>
      </div>
      <div id="patientList" class="patient-list">
        <div class="empty" id="loadingText">جارٍ تحميل المرضى...</div>
      </div>
    </section>

    <section id="profileSection" class="card hidden">
      <h2 id="profileTitle">ملف المريض</h2>
      <div id="profileContent"></div>
      <div id="barcodeBox">
        <svg id="barcodeSvg"></svg>
      </div>
      <div class="actions no-print">
        <button id="printProfileButton" type="button">طباعة الملف والباركود</button>
        <button id="editProfileButton" class="secondary" type="button">تعديل البيانات</button>
        <button id="closeProfileButton" class="secondary" type="button">إغلاق الملف</button>
      </div>
    </section>
  </section>
</main>

<div id="printArea" class="hidden"></div>
<footer id="footerText">بيانات المرضى خاصة. لا تشارك بيانات الدخول مع غير المخولين.</footer>

function t(key) {
  return translations[language][key] || key;
}

function showMessage(message, type = "") {
  const el = $("globalMessage");
  el.textContent = message;
  el.className = "message" + (type ? " " + type : "");
  el.classList.remove("hidden");
}

function hideMessage() {
  $("globalMessage").classList.add("hidden");
}

function setLanguage(nextLanguage) {
  language = nextLanguage === "en" ? "en" : "ar";
  localStorage.setItem("pharmacyLanguage", language);

  document.documentElement.lang = language;
  document.documentElement.dir = language === "ar" ? "rtl" : "ltr";

  const textMap = {
    appTitle: "title",
    appSubtitle: "subtitle",
    loginTitle: "login",
    loginHint: "loginHint",
    emailLabel: "email",
    passwordLabel: "password",
    loginButton: "signIn",
    logoutButton: "logout",
    totalLabel: "total",
    resultsLabel: "results",
    accountLabel: "account",
    nameLabel: "name",
    phoneLabel: "phone",
    diseaseLabel: "disease",
    barcodeLabel: "barcode",
    daysLabel: "days",
    visitLabel: "visit",
    medicinesLabel: "medicines",
    notesLabel: "notes",
    savePatientButton: $("patientId").value ? "update" : "save",
    cancelEditButton: "cancel",
    clearFormButton: "clear",
    patientsTitle: "patients",
    refreshButton: "refresh",
    profileTitle: "profile",
    printProfileButton: "print",
    editProfileButton: "edit",
    closeProfileButton: "close",
    footerText: "footer",
    languageButton: "languageButton"
  };

  Object.keys(textMap).forEach(id => {
    const el = $(id);
    if (el) el.textContent = t(textMap[id]);
  });

  $("searchInput").placeholder = t("search");
  $("patientList").setAttribute("aria-live", "polite");

  if ($("patientId").value) {
    $("formTitle").textContent = t("editPatient");
  } else {
    $("formTitle").textContent = t("addPatient");
  }

  if (patients.length || !loadingPatients) renderPatients();
  if (currentPatient) showProfile(currentPatient, false);
}

$("languageButton").addEventListener("click", () => {
  setLanguage(language === "ar" ? "en" : "ar");
});

function readableError(error) {
  if (!error) return t("genericError");
  if (error.code === "auth/invalid-credential" ||
      error.code === "auth/wrong-password" ||
      error.code === "auth/user-not-found") {
    return t("loginError");
  }
  if (error.code === "permission-denied" ||
      error.code === "firestore/permission-denied") {
    return t("loadError");
  }
  return (error.message || t("genericError"));
}

function setBusy(button, busy, busyText) {
  if (!button.dataset.originalText) {
    button.dataset.originalText = button.textContent;
  }
  button.disabled = busy;
  button.textContent = busy ? (busyText || t("saving")) : button.dataset.originalText;
}

function initFirebase() {
  if (!window.firebase) {
    showMessage("Firebase SDK لم يتم تحميله. تحقق من اتصال الإنترنت.", "error");
    return false;
  }

  try {
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    auth = firebase.auth();
    db = firebase.firestore();
    return true;
  } catch (error) {
    console.error(error);
    showMessage(readableError(error), "error");
    return false;
  }
}

$("loginForm").addEventListener("submit", async event => {
  event.preventDefault();
  hideMessage();

  if (!auth) {
    showMessage(t("genericError"), "error");
    return;
  }

  const button = $("loginButton");
  setBusy(button, true, t("saving"));

  try {
    await auth.signInWithEmailAndPassword(
      $("email").value.trim(),
      $("password").value
    );
    $("password").value = "";
  } catch (error) {
    console.error(error);
    showMessage(readableError(error), "error");
  } finally {
    setBusy(button, false);
  }
});

$("logoutButton").addEventListener("click", async () => {
  try {
    await auth.signOut();
  } catch (error) {
    showMessage(t("logoutError"), "error");
  }
});

function showSignedOut() {
  $("loginSection").classList.remove("hidden");
  $("appSection").classList.add("hidden");
  $("logoutButton").classList.add("hidden");
  $("accountEmail").textContent = "—";
  patients = [];
  currentPatient = null;
  $("profileSection").classList.add("hidden");
  $("patientList").innerHTML = "";
}

async function showSignedIn(user) {
  $("loginSection").classList.add("hidden");
  $("appSection").classList.remove("hidden");
  $("logoutButton").classList.remove("hidden");
  $("accountEmail").textContent = user.email || user.uid;
  await loadPatients();
}

async function loadPatients() {
  if (!db || !auth || !auth.currentUser) return;

  loadingPatients = true;
  $("patientList").innerHTML = '<div class="empty">' + t("loading") + '</div>';

  try {
    const snapshot = await db.collection("patients").get();
    patients = snapshot.docs.map(doc => ({
      id: doc.id,
      ...doc.data()
    }));

    patients.sort((a, b) =>
      String(a.name || "").localeCompare(String(b.name || ""), language === "ar" ? "ar" : "en")
    );

    renderPatients();
  } catch (error) {
    console.error(error);
    $("patientList").innerHTML = "";
    showMessage(t("loadError") + " " + readableError(error), "error");
  } finally {
    loadingPatients = false;
  }
}

function escapeHTML(value) {
  return String(value == null ? "" : value).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[char]));
}

function getFilteredPatients() {
  const query = $("searchInput").value.trim().toLocaleLowerCase();
  if (!query) return patients;

  return patients.filter(patient => {
    const searchable = [
      patient.name,
      patient.phone,
      patient.barcode,
      patient.disease
    ].map(value => String(value || "").toLocaleLowerCase());

    return searchable.some(value => value.includes(query));
  });
}

function renderPatients() {
  $("totalPatients").textContent = String(patients.length);
  const filtered = getFilteredPatients();
  $("resultCount").textContent = String(filtered.length);

  const list = $("patientList");
  list.innerHTML = "";

  if (!filtered.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = patients.length ? t("noResults") : t("noPatients");
    list.appendChild(empty);
    return;
  }

  filtered.forEach(patient => {
    const row = document.createElement("article");
    row.className = "patient";

    const info = document.createElement("div");
    info.className = "patient-info";

    const name = document.createElement("strong");
    name.textContent = patient.name || t("noValue");

    const phone = document.createElement("div");
    phone.className = "muted";
    phone.textContent = t("phoneLabel") + ": " + (patient.phone || t("noValue"));

    const disease = document.createElement("div");
    disease.className = "muted";
    disease.textContent = t("diseaseLabel") + ": " + (patient.disease || t("noValue"));

    const barcode = document.createElement("div");
    barcode.className = "muted";
    barcode.textContent = t("barcodeLabel") + ": " + (patient.barcode || patient.id);

    info.append(name, phone, disease, barcode);

    const actions = document.createElement("div");
    actions.className = "patient-actions";

    const viewButton = document.createElement("button");
    viewButton.className = "small";
    viewButton.textContent = t("view");
    viewButton.addEventListener("click", () => showProfile(patient));

    const editButton = document.createElement("button");
    editButton.className = "small secondary";
    editButton.textContent = t("edit");
    editButton.addEventListener("click", () => fillForm(patient));

    const deleteButton = document.createElement("button");
    deleteButton.className = "small danger";
    deleteButton.textContent = t("delete");
    deleteButton.addEventListener("click", () => deletePatient(patient));

    actions.append(viewButton, editButton, deleteButton);
    row.append(info, actions);
    list.appendChild(row);
  });
}

$("searchInput").addEventListener("input", renderPatients);
$("refreshButton").addEventListener("click", loadPatients);

function resetForm() {
  $("patientForm").reset();
  $("patientId").value = "";
  $("followUpDays").value = "30";
  $("formTitle").textContent = t("addPatient");
  $("savePatientButton").textContent = t("save");
  $("cancelEditButton").classList.add("hidden");
  currentPatient = null;
}

$("clearFormButton").addEventListener("click", resetForm);
$("cancelEditButton").addEventListener("click", resetForm);

function fillForm(patient) {
  $("patientId").value = patient.id;
  $("patientName").value = patient.name || "";
  $("patientPhone").value = patient.phone || "";
  $("patientDisease").value = patient.disease || "";
  $("patientBarcode").value = patient.barcode || patient.id;
  $("followUpDays").value = Number(patient.followUpDays ?? 30);
  $("lastVisit").value = patient.lastVisit || "";
  $("patientMedicines").value = patient.medicines || "";
  $("patientNotes").value = patient.notes || "";

  $("formTitle").textContent = t("editPatient");
  $("savePatientButton").textContent = t("update");
  $("cancelEditButton").classList.remove("hidden");

  $("profileSection").classList.add("hidden");
  $("patientName").focus();
  $("patientForm").scrollIntoView({ behavior: "smooth", block: "start" });
}

$("patientForm").addEventListener("submit", async event => {
  event.preventDefault();
  hideMessage();

  if (!auth || !auth.currentUser) {
    showMessage(t("loginRequired"), "error");
    return;
  }

  const name = $("patientName").value.trim();
  const phone = $("patientPhone").value.trim();

  if (!name || !phone) {
    showMessage(t("required"), "error");
    return;
  }

  const id = $("patientId").value;
  const barcodeInput = $("patientBarcode").value.trim();

  const data = {
    name,
    phone,
    disease: $("patientDisease").value.trim(),
    barcode: barcodeInput,
    followUpDays: Math.max(0, Number($("followUpDays").value || 0)),
    lastVisit: $("lastVisit").value,
    medicines: $("patientMedicines").value.trim(),
    notes: $("patientNotes").value.trim(),
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  };

  const button = $("savePatientButton");
  setBusy(button, true, t("saving"));

  try {
    if (id) {
      const existing = patients.find(patient => patient.id === id);
      data.barcode = barcodeInput || (existing && existing.barcode) || id;
      await db.collection("patients").doc(id).update(data);
      showMessage(t("updated"), "success");
    } else {
      data.createdAt = firebase.firestore.FieldValue.serverTimestamp();

      const ref = await db.collection("patients").add(data);
      if (!data.barcode) {
        await ref.update({ barcode: ref.id });
      }
      showMessage(t("saved"), "success");
    }

    resetForm();
    await loadPatients();
  } catch (error) {
    console.error(error);
    showMessage(readableError(error), "error");
  } finally {
    setBusy(button, false);
  }
});

async function deletePatient(patient) {
  if (!confirm(t("confirmDelete"))) return;
  if (!auth || !auth.currentUser) {
    showMessage(t("loginRequired"), "error");
    return;
  }

  try {
    await db.collection("patients").doc(patient.id).delete();

    if (currentPatient && currentPatient.id === patient.id) {
      currentPatient = null;
      $("profileSection").classList.add("hidden");
    }

    if ($("patientId").value === patient.id) resetForm();

    showMessage(t("deleted"), "success");
    await loadPatients();
  } catch (error) {
    console.error(error);
    showMessage(readableError(error), "error");
  }
}

function formatDate(value) {
  if (!value) return t("noValue");
  return value;
}

function showProfile(patient, scroll = true) {
  currentPatient = patient;

  const items = [
    [t("name"), patient.name],
    [t("phoneLabel"), patient.phone],
    [t("diseaseLabel"), patient.disease],
    [t("barcodeLabel"), patient.barcode || patient.id],
    [t("daysLabel"), patient.followUpDays],
    [t("visitLabel"), formatDate(patient.lastVisit)],
    [t("medicinesLabel"), patient.medicines],
    [t("notesLabel"), patient.notes]
  ];

  const content = $("profileContent");
  content.innerHTML = "";
  const grid = document.createElement("div");
  grid.className = "profile-grid";

  items.forEach(([label, value]) => {
    const item = document.createElement("div");
    item.className = "profile-item";

    const title = document.createElement("strong");
    title.textContent = label;

    const text = document.createElement("div");
    text.textContent = value === undefined || value === null || value === ""
      ? t("noValue")
      : String(value);

    item.append(title, text);
    grid.appendChild(item);
  });

  content.appendChild(grid);

  const barcodeValue = String(patient.barcode || patient.id || "").trim();
  const svg = $("barcodeSvg");
  svg.innerHTML = "";

  if (barcodeValue && window.JsBarcode) {
    try {
      JsBarcode(svg, barcodeValue, {
        format: "CODE128",
        displayValue: true,
        height: 65,
        margin: 8,
        fontSize: 14
      });
    } catch (error) {
      console.error(error);
      showMessage(t("printError"), "error");
    }
  } else {
    showMessage(t("printError"), "error");
  }

  $("profileSection").classList.remove("hidden");
  if (scroll) {
    $("profileSection").scrollIntoView({ behavior: "smooth", block: "start" });
  }
}

$("editProfileButton").addEventListener("click", () => {
  if (currentPatient) fillForm(currentPatient);
});

$("closeProfileButton").addEventListener("click", () => {
  $("profileSection").classList.add("hidden");
});

$("printProfileButton").addEventListener("click", () => {
  if (!currentPatient) return;

  const patient = currentPatient;
  const barcodeSvg = $("barcodeSvg").outerHTML;
  const labels = [
    [t("name"), patient.name],
    [t("phoneLabel"), patient.phone],
    [t("diseaseLabel"), patient.disease],
    [t("barcodeLabel"), patient.barcode || patient.id],
    [t("daysLabel"), patient.followUpDays],
    [t("visitLabel"), patient.lastVisit],
    [t("medicinesLabel"), patient.medicines],
    [t("notesLabel"), patient.notes]
  ];

  const printable = $("printArea");
  printable.innerHTML = "";

  const title = document.createElement("h2");
  title.textContent = t("profile");
  printable.appendChild(title);

  labels.forEach(([label, value]) => {
    const p = document.createElement("p");
    const strong = document.createElement("strong");
    strong.textContent = label + ": ";
    p.appendChild(strong);
    p.appendChild(document.createTextNode(
      value === undefined || value === null || value === ""
        ? t("noValue")
        : String(value)
    ));
    printable.appendChild(p);
  });

  const barcodeWrap = document.createElement("div");
  barcodeWrap.style.textAlign = "center";
  barcodeWrap.innerHTML = barcodeSvg;
  printable.appendChild(barcodeWrap);

  printable.classList.remove("hidden");
  window.print();
  setTimeout(() => printable.classList.add("hidden"), 500);
});

setLanguage(language);

if (initFirebase()) {
  auth.onAuthStateChanged(async user => {
    hideMessage();

    if (user) {
      await showSignedIn(user);
    } else {
      showSignedOut();
    }
  });
}
</script>
</body>
</html>
