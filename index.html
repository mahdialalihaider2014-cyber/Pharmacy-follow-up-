
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#087f8c">
  <title>نظام متابعة مرضى الصيدلية</title>

  <style>
    :root {
      --primary: #087f8c;
      --background: #f3f7fa;
      --border: #dce5eb;
      --text: #203040;
      --muted: #667788;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: var(--background);
      color: var(--text);
      line-height: 1.6;
    }
    button, input, textarea { font: inherit; }
    button {
      cursor: pointer;
      border: 0;
      border-radius: 9px;
      padding: 10px 14px;
      background: var(--primary);
      color: white;
    }
    button:disabled { opacity: .6; }
    .secondary { background: #e8f1f4; color: #174451; }
    .danger { background: #c62828; }
    header {
      background: var(--primary);
      color: white;
      padding: 16px 4%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    header h1 { margin: 0; font-size: 21px; }
    header p { margin: 3px 0 0; font-size: 13px; }
    .header-actions, .actions, .toolbar, .patient-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .header-actions button { background: white; color: var(--primary); }
    main { width: min(1050px, 94%); margin: 22px auto; }
    .card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 18px;
    }
    h2 { margin: 0 0 15px; font-size: 19px; }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 13px;
    }
    .field { display: flex; flex-direction: column; gap: 5px; }
    .full { grid-column: 1 / -1; }
    label { font-size: 14px; font-weight: 600; }
    input, textarea {
      width: 100%;
      padding: 11px;
      border: 1px solid #ccd8e0;
      border-radius: 9px;
      background: white;
      color: var(--text);
    }
    textarea { min-height: 85px; resize: vertical; }
    .actions { margin-top: 15px; }
    .toolbar { margin-bottom: 15px; }
    .toolbar input { flex: 1; min-width: 190px; }
    .stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }
    .stat {
      background: white;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 13px;
      overflow-wrap: anywhere;
    }
    .stat span { display: block; color: var(--muted); font-size: 13px; }
    .stat strong { color: var(--primary); }
    .patient-list { display: grid; gap: 12px; }
    .patient {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 13px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .patient-info { flex: 1; min-width: 180px; overflow-wrap: anywhere; }
    .patient-info strong { display: block; }
    .muted { color: var(--muted); font-size: 13px; }
    .message, .empty {
      padding: 12px;
      margin: 10px 0;
      border-radius: 9px;
      background: #eef5f7;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }
    .error { background: #ffebee; color: #9b1c1c; }
    .success { background: #e7f6ed; color: #176638; }
    .hidden { display: none !important; }
    .profile-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .profile-item {
      padding: 9px 0;
      border-bottom: 1px solid var(--border);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .profile-item strong { display: block; color: var(--muted); font-size: 13px; }
    #barcodeBox { text-align: center; padding: 18px 0; }
    footer { text-align: center; color: var(--muted); font-size: 12px; padding: 18px; }
    @media (max-width: 600px) {
      .form-grid, .profile-grid, .stats { grid-template-columns: 1fr; }
      .card { padding: 14px; }
    }
    @media print {
      body * { visibility: hidden !important; }
      #printArea, #printArea * { visibility: visible !important; }
      #printArea {
        display: block !important;
        position: absolute;
        inset: 0;
        width: 100%;
        padding: 20px;
        background: white;
        color: black;
      }
    }
  </style>
</head>

<body>
<header>
  <div>
    <h1 id="appTitle">نظام متابعة مرضى الصيدلية</h1>
    <p id="subtitle">إدارة ملفات المرضى ومواعيد المراجعة</p>
  </div>
  <div class="header-actions">
    <button id="languageButton" type="button">English</button>
    <button id="logoutButton" class="hidden" type="button">تسجيل الخروج</button>
  </div>
</header>

<main>
  <div id="message" class="message hidden" role="status"></div>

  <section id="loginSection" class="card">
    <h2 id="loginTitle">تسجيل الدخول</h2>
    <p id="loginHint" class="muted">أدخل حساب Firebase المصرح له.</p>
    <form id="loginForm">
      <div class="form-grid">
        <div class="field full">
          <label id="emailLabel" for="email">البريد الإلكتروني</label>
          <input id="email" type="email" autocomplete="username" required>
        </div>
        <div class="field full">
          <label id="passwordLabel" for="password">كلمة المرور</label>
          <input id="password" type="password" autocomplete="current-password" required>
        </div>
      </div>
      <div class="actions">
        <button id="loginButton" type="submit">دخول</button>
      </div>
    </form>
  </section>

  <section id="appSection" class="hidden">
    <div class="stats">
      <div class="stat">
        <span id="totalLabel">إجمالي المرضى</span>
        <strong id="totalPatients">0</strong>
      </div>
      <div class="stat">
        <span id="accountLabel">الحساب الحالي</span>
        <strong id="accountEmail">—</strong>
      </div>
    </div>

    <section class="card">
      <h2 id="formTitle">إضافة مريض جديد</h2>
      <form id="patientForm">
        <input id="patientId" type="hidden">
        <div class="form-grid">
          <div class="field">
            <label id="nameLabel" for="patientName">اسم المريض *</label>
            <input id="patientName" maxlength="150" required>
          </div>
          <div class="field">
            <label id="phoneLabel" for="patientPhone">رقم الهاتف *</label>
            <input id="patientPhone" type="tel" maxlength="30" required>
          </div>
          <div class="field">
            <label id="diseaseLabel" for="disease">المرض المزمن</label>
            <input id="disease" maxlength="250">
          </div>
          <div class="field">
            <label id="barcodeLabel" for="patientBarcode">الباركود (اختياري)</label>
            <input id="patientBarcode" maxlength="100">
          </div>
          <div class="field">
            <label id="daysLabel" for="followUpDays">المراجعة بعد (أيام)</label>
            <input id="followUpDays" type="number" min="0" max="3650" value="30">
          </div>
          <div class="field">
            <label id="visitLabel" for="lastVisit">تاريخ آخر مراجعة</label>
            <input id="lastVisit" type="date">
          </div>
          <div class="field full">
            <label id="medicinesLabel" for="medicines">الأدوية والجرعات</label>
            <textarea id="medicines" maxlength="5000"></textarea>
          </div>
          <div class="field full">
            <label id="notesLabel" for="notes">ملاحظات</label>
            <textarea id="notes" maxlength="5000"></textarea>
          </div>
        </div>
        <div class="actions">
          <button id="saveButton" type="submit">حفظ المريض</button>
          <button id="cancelButton" class="secondary hidden" type="button">إلغاء التعديل</button>
          <button id="clearButton" class="secondary" type="button">تفريغ الحقول</button>
        </div>
      </form>
    </section>

    <section class="card">
      <h2 id="patientsTitle">ملفات المرضى</h2>
      <div class="toolbar">
        <input id="search" type="search" placeholder="بحث بالاسم أو الهاتف أو الباركود">
        <button id="refreshButton" class="secondary" type="button">تحديث</button>
      </div>
      <div id="patientList" class="patient-list"></div>
    </section>

    <section id="profileSection" class="card hidden">
      <h2 id="profileTitle">ملف المريض</h2>
      <div id="profileContent"></div>
      <div id="barcodeBox"><svg id="barcodeSvg"></svg></div>
      <div class="actions">
        <button id="printButton" type="button">طباعة الملف والباركود</button>
        <button id="editButton" class="secondary" type="button">تعديل</button>
        <button id="closeProfileButton" class="secondary" type="button">إغلاق</button>
      </div>
    </section>
  </section>
</main>

<div id="printArea" class="hidden"></div>
<footer id="footerText">بيانات المرضى خاصة؛ لا تشارك بيانات الدخول مع غير المخولين.</footer>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

<script>
"use strict";

const firebaseConfig = {
  apiKey: "AIzaSyDLu_X9iHY7xq1greKqRs2wJ3pva2iwM_Y",
  authDomain: "pharmacy-patients-follow-up.firebaseapp.com",
  projectId: "pharmacy-patients-follow-up",
  storageBucket: "pharmacy-patients-follow-up.firebasestorage.app",
  messagingSenderId: "899059950457",
  appId: "1:899059950457:web:76a04a9ab317dbb14905a8"
};

const $ = id => document.getElementById(id);
let auth, db, patients = [], selectedPatient = null;
let language = localStorage.getItem("pharmacyLanguage") || "ar";

const words = {
  ar: {
    title:"نظام متابعة مرضى الصيدلية", subtitle:"إدارة ملفات المرضى ومواعيد المراجعة",
    login:"تسجيل الدخول", loginHint:"أدخل حساب Firebase المصرح له.",
    email:"البريد الإلكتروني", password:"كلمة المرور", signIn:"دخول", logout:"تسجيل الخروج",
    total:"إجمالي المرضى", account:"الحساب الحالي", add:"إضافة مريض جديد", editForm:"تعديل بيانات المريض",
    name:"اسم المريض", phone:"رقم الهاتف", disease:"المرض المزمن", barcode:"الباركود (اختياري)",
    days:"المراجعة بعد (أيام)", visit:"تاريخ آخر مراجعة", medicines:"الأدوية والجرعات", notes:"ملاحظات",
    save:"حفظ المريض", update:"حفظ التعديلات", cancel:"إلغاء التعديل", clear:"تفريغ الحقول",
    patients:"ملفات المرضى", search:"بحث بالاسم أو الهاتف أو الباركود", refresh:"تحديث",
    loading:"جارٍ تحميل المرضى...", none:"لا توجد ملفات مرضى.", noResults:"لا توجد نتائج.",
    view:"عرض الملف", edit:"تعديل", delete:"حذف", profile:"ملف المريض", print:"طباعة الملف والباركود",
    close:"إغلاق", saved:"تم حفظ المريض بنجاح.", updated:"تم تحديث بيانات المريض.",
    deleted:"تم حذف المريض.", required:"أدخل اسم المريض ورقم الهاتف.",
    confirmDelete:"هل تريد حذف ملف هذا المريض نهائيًا؟",
    footer:"بيانات المرضى خاصة؛ لا تشارك بيانات الدخول مع غير المخولين.",
    languageButton:"English", noValue:"غير محدد", phoneLabel:"الهاتف",
    diseaseLabel:"المرض المزمن", barcodeLabel:"الباركود", daysLabel:"أيام المتابعة",
    visitLabel:"آخر مراجعة", medicinesLabel:"الأدوية والجرعات", notesLabel:"ملاحظات",
    createdLabel:"تاريخ إنشاء الملف", generic:"حدث خطأ. راجع تفاصيل الخطأ أدناه.",
    loginRequired:"يرجى تسجيل الدخول أولاً.", saving:"جارٍ الحفظ..."
  },
  en: {
    title:"Pharmacy Patient Follow-up", subtitle:"Manage patient records and follow-up",
    login:"Sign in", loginHint:"Use an authorized Firebase account.",
    email:"Email", password:"Password", signIn:"Sign in", logout:"Sign out",
    total:"Total patients", account:"Current account", add:"Add patient", editForm:"Edit patient",
    name:"Patient name", phone:"Phone number", disease:"Chronic condition", barcode:"Barcode (optional)",
    days:"Follow-up after (days)", visit:"Last visit", medicines:"Medicines and doses", notes:"Notes",
    save:"Save patient", update:"Save changes", cancel:"Cancel edit", clear:"Clear fields",
    patients:"Patient records", search:"Search by name, phone, or barcode", refresh:"Refresh",
    loading:"Loading patients...", none:"No patient records.", noResults:"No results found.",
    view:"View profile", edit:"Edit", delete:"Delete", profile:"Patient profile", print:"Print profile and barcode",
    close:"Close", saved:"Patient saved.", updated:"Patient updated.",
    deleted:"Patient deleted.", required:"Enter patient name and phone.",
    confirmDelete:"Permanently delete this patient?",
    footer:"Patient data is private. Do not share credentials.",
    languageButton:"العربية", noValue:"Not specified", phoneLabel:"Phone",
    diseaseLabel:"Chronic condition", barcodeLabel:"Barcode", daysLabel:"Follow-up days",
    visitLabel:"Last visit", medicinesLabel:"Medicines and doses", notesLabel:"Notes",
    createdLabel:"Record created", generic:"An error occurred. See error details below.",
    loginRequired:"Please sign in first.", saving:"Saving..."
  }
};

function t(k) { return words[language][k] || k; }

function showMessage(text, type="") {
  $("message").textContent = text;
  $("message").className = "message" + (type ? " " + type : "");
  $("message").classList.remove("hidden");
}
function clearMessage() { $("message").classList.add("hidden"); }

function displayFirebaseError(error, context="") {
  console.error("Firebase error:", context, error);
  const code = error && error.code ? error.code : "unknown";
  const detail = error && error.message ? error.message : String(error || "");
  showMessage(
    "رمز الخطأ: " + code + "\nالتفاصيل: " + detail +
    (context ? "\nالمكان: " + context : ""),
    "error"
  );
}

function setLanguage(next) {
  language = next === "en" ? "en" : "ar";
  localStorage.setItem("pharmacyLanguage", language);
  document.documentElement.lang = language;
  document.documentElement.dir = language === "ar" ? "rtl" : "ltr";

  const map = {
    appTitle:"title", subtitle:"subtitle", loginTitle:"login",
    loginHint:"loginHint", emailLabel:"email", passwordLabel:"password",
    loginButton:"signIn", logoutButton:"logout", totalLabel:"total",
    accountLabel:"account", nameLabel:"name", phoneLabel:"phone",
    diseaseLabel:"disease", barcodeLabel:"barcode", daysLabel:"days",
    visitLabel:"visit", medicinesLabel:"medicines", notesLabel:"notes",
    patientsTitle:"patients", refreshButton:"refresh", profileTitle:"profile",
    printButton:"print", editButton:"edit", closeProfileButton:"close",
    footerText:"footer", languageButton:"languageButton",
    clearButton:"clear", cancelButton:"cancel"
  };

  for (const [id,key] of Object.entries(map)) $(id).textContent = t(key);
  $("search").placeholder = t("search");
  $("formTitle").textContent = $("patientId").value ? t("editForm") : t("add");
  $("saveButton").textContent = $("patientId").value ? t("update") : t("save");
  renderPatients();
  if (selectedPatient) showProfile(selectedPatient, false);
}
$("languageButton").addEventListener("click", () => setLanguage(language === "ar" ? "en" : "ar"));

function initFirebase() {
  try {
    if (!window.firebase) {
      showMessage("تعذر تحميل مكتبة Firebase. تحقق من اتصال الإنترنت.", "error");
      return false;
    }
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    auth = firebase.auth();
    db = firebase.firestore();
    return true;
  } catch (error) {
    displayFirebaseError(error, "تهيئة Firebase");
    return false;
  }
}

$("loginForm").addEventListener("submit", async event => {
  event.preventDefault();
  clearMessage();

  if (!auth) {
    showMessage("Firebase لم يبدأ بشكل صحيح. أعد تحميل الصفحة.", "error");
    return;
  }

  const button = $("loginButton");
  button.disabled = true;
  button.textContent = t("saving");

  try {
    await auth.signInWithEmailAndPassword(
      $("email").value.trim(),
      $("password").value
    );
    $("password").value = "";
  } catch (error) {
    displayFirebaseError(error, "تسجيل الدخول");
  } finally {
    button.disabled = false;
    button.textContent = t("signIn");
  }
});

$("logoutButton").addEventListener("click", async () => {
  try {
    await auth.signOut();
  } catch (error) {
    displayFirebaseError(error, "تسجيل الخروج");
  }
});

function showSignedOut() {
  $("loginSection").classList.remove("hidden");
  $("appSection").classList.add("hidden");
  $("logoutButton").classList.add("hidden");
  $("accountEmail").textContent = "—";
  patients = [];
  selectedPatient = null;
  $("profileSection").classList.add("hidden");
  $("patientList").innerHTML = "";
}

async function showSignedIn(user) {
  $("loginSection").classList.add("hidden");
  $("appSection").classList.remove("hidden");
  $("logoutButton").classList.remove("hidden");
  $("accountEmail").textContent = user.email || user.uid;
  await loadPatients();
}

async function loadPatients() {
  if (!db || !auth || !auth.currentUser) return;
  $("patientList").innerHTML = '<div class="empty">' + t("loading") + '</div>';

  try {
    const snapshot = await db.collection("patients").get();
    patients = snapshot.docs.map(doc => ({ id:doc.id, ...doc.data() }));
    patients.sort((a,b) => String(a.name || "").localeCompare(String(b.name || "")));
    renderPatients();
    clearMessage();
  } catch (error) {
    $("patientList").innerHTML = "";
    displayFirebaseError(error, "تحميل ملفات المرضى من Firestore");
  }
}

function renderPatients() {
  if (!$("patientList")) return;
  $("totalPatients").textContent = patients.length;
  const query = $("search").value.trim().toLocaleLowerCase();
  const filtered = patients.filter(p =>
    [p.name,p.phone,p.barcode,p.disease,p.id]
      .some(v => String(v || "").toLocaleLowerCase().includes(query))
  );

  const list = $("patientList");
  list.innerHTML = "";

  if (!filtered.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = patients.length ? t("noResults") : t("none");
    list.appendChild(empty);
    return;
  }

  filtered.forEach(p => {
    const row = document.createElement("article");
    row.className = "patient";
    const info = document.createElement("div");
    info.className = "patient-info";

    const name = document.createElement("strong");
    name.textContent = p.name || t("noValue");
    const phone = document.createElement("div");
    phone.className = "muted";
    phone.textContent = t("phoneLabel") + ": " + (p.phone || t("noValue"));
    const barcode = document.createElement("div");
    barcode.className = "muted";
    barcode.textContent = t("barcodeLabel") + ": " + (p.barcode || p.id);
    info.append(name, phone, barcode);

    const actions = document.createElement("div");
    actions.className = "patient-actions";

    const view = document.createElement("button");
    view.className = "small";
    view.textContent = t("view");
    view.addEventListener("click", () => showProfile(p));

    const edit = document.createElement("button");
    edit.className = "small secondary";
    edit.textContent = t("edit");
    edit.addEventListener("click", () => fillForm(p));

    const del = document.createElement("button");
    del.className = "small danger";
    del.textContent = t("delete");
    del.addEventListener("click", () => deletePatient(p));

    actions.append(view, edit, del);
    row.append(info, actions);
    list.appendChild(row);
  });
}

$("search").addEventListener("input", renderPatients);
$("refreshButton").addEventListener("click", loadPatients);

function resetForm() {
  $("patientForm").reset();
  $("patientId").value = "";
  $("followUpDays").value = "30";
  $("formTitle").textContent = t("add");
  $("saveButton").textContent = t("save");
  $("cancelButton").classList.add("hidden");
}

$("clearButton").addEventListener("click", resetForm);
$("cancelButton").addEventListener("click", resetForm);

function fillForm(p) {
  $("patientId").value = p.id;
  $("patientName").value = p.name || "";
  $("patientPhone").value = p.phone || "";
  $("disease").value = p.disease || "";
  $("patientBarcode").value = p.barcode || p.id;
  $("followUpDays").value = Number(p.followUpDays ?? 30);
  $("lastVisit").value = p.lastVisit || "";
  $("medicines").value = p.medicines || "";
  $("notes").value = p.notes || "";
  $("formTitle").textContent = t("editForm");
  $("saveButton").textContent = t("update");
  $("cancelButton").classList.remove("hidden");
  $("profileSection").classList.add("hidden");
  $("patientForm").scrollIntoView({behavior:"smooth"});
}

$("patientForm").addEventListener("submit", async event => {
  event.preventDefault();
  clearMessage();
  if (!auth || !auth.currentUser) {
    showMessage(t("loginRequired"), "error");
    return;
  }

  const id = $("patientId").value;
  const name = $("patientName").value.trim();
  const phone = $("patientPhone").value.trim();
  if (!name || !phone) {
    showMessage(t("required"), "error");
    return;
  }

  const data = {
    name,
    phone,
    disease: $("disease").value.trim(),
    barcode: $("patientBarcode").value.trim(),
    followUpDays: Math.max(0, Number($("followUpDays").value || 0)),
    lastVisit: $("lastVisit").value,
    medicines: $("medicines").value.trim(),
    notes: $("notes").value.trim(),
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  };

  const button = $("saveButton");
  button.disabled = true;
  button.textContent = t("saving");

  try {
    if (id) {
      const old = patients.find(p => p.id === id);
      data.barcode = data.barcode || (old && old.barcode) || id;
      await db.collection("patients").doc(id).update(data);
      showMessage(t("updated"), "success");
    } else {
      data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
      const ref = await db.collection("patients").add(data);
      if (!data.barcode) await ref.update({barcode:ref.id});
      showMessage(t("saved"), "success");
    }

    resetForm();
    await loadPatients();
  } catch (error) {
    displayFirebaseError(error, "حفظ بيانات المريض");
  } finally {
    button.disabled = false;
    button.textContent = $("patientId").value ? t("update") : t("save");
  }
});

async function deletePatient(p) {
  if (!confirm(t("confirmDelete"))) return;
  try {
    await db.collection("patients").doc(p.id).delete();
    if (selectedPatient && selectedPatient.id === p.id) {
      selectedPatient = null;
      $("profileSection").classList.add("hidden");
    }
    showMessage(t("deleted"), "success");
    await loadPatients();
  } catch (error) {
    displayFirebaseError(error, "حذف المريض");
  }
}

function showProfile(p, scroll=true) {
  selectedPatient = p;
  const fields = [
    [t("name"),p.name], [t("phoneLabel"),p.phone],
    [t("diseaseLabel"),p.disease], [t("barcodeLabel"),p.barcode || p.id],
    [t("daysLabel"),p.followUpDays], [t("visitLabel"),p.lastVisit],
    [t("medicinesLabel"),p.medicines], [t("notesLabel"),p.notes]
  ];

  const grid = document.createElement("div");
  grid.className = "profile-grid";
  fields.forEach(([label,value]) => {
    const item = document.createElement("div");
    item.className = "profile-item";
    const strong = document.createElement("strong");
    strong.textContent = label;
    const content = document.createElement("div");
    content.textContent = value === undefined || value === null || value === ""
      ? t("noValue") : String(value);
    item.append(strong,content);
    grid.appendChild(item);
  });
  $("profileContent").replaceChildren(grid);

  const svg = $("barcodeSvg");
  svg.innerHTML = "";
  try {
    if (!window.JsBarcode) throw new Error("Barcode library unavailable");
    JsBarcode(svg, String(p.barcode || p.id), {
      format:"CODE128", displayValue:true, height:60, margin:8
    });
  } catch (error) {
    displayFirebaseError(error, "إنشاء الباركود");
  }

  $("profileSection").classList.remove("hidden");
  if (scroll) $("profileSection").scrollIntoView({behavior:"smooth"});
}

$("editButton").addEventListener("click", () => {
  if (selectedPatient) fillForm(selectedPatient);
});
$("closeProfileButton").addEventListener("click", () => {
  $("profileSection").classList.add("hidden");
});

$("printButton").addEventListener("click", () => {
  if (!selectedPatient) return;
  const p = selectedPatient;
  const area = $("printArea");
  area.innerHTML = "";
  const title = document.createElement("h2");
  title.textContent = t("profile");
  area.appendChild(title);

  [
    [t("name"),p.name],[t("phoneLabel"),p.phone],
    [t("diseaseLabel"),p.disease],[t("barcodeLabel"),p.barcode || p.id],
    [t("daysLabel"),p.followUpDays],[t("visitLabel"),p.lastVisit],
    [t("medicinesLabel"),p.medicines],[t("notesLabel"),p.notes]
  ].forEach(([label,value]) => {
    const pEl = document.createElement("p");
    const b = document.createElement("strong");
    b.textContent = label + ": ";
    pEl.append(b, document.createTextNode(value == null ? "" : String(value)));
    area.appendChild(pEl);
  });

  const barcode = document.createElement("div");
  barcode.style.textAlign = "center";
  barcode.innerHTML = $("barcodeSvg").outerHTML;
  area.appendChild(barcode);

  area.classList.remove("hidden");
  window.print();
  setTimeout(() => area.classList.add("hidden"), 700);
});

setLanguage(language);

if (initFirebase()) {
  auth.onAuthStateChanged(user => {
    clearMessage();
    if (user) showSignedIn(user);
    else showSignedOut();
  });
}
</script>
</body>
</html>
